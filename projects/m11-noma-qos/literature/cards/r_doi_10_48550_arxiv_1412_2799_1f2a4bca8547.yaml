id: doi:10.48550/arxiv.1412.2799
title: Impact of User Pairing on 5G Non-Orthogonal Multiple Access
authors:
- Zhiguo Ding
- Pingzhi Fan
- H. Vincent Poor
year: 2014
venue:
  name: arXiv (Cornell University)
  metadata_source: retrieved candidate record; manuscript version distinguished in notes
citations: null
system:
  direction: downlink
  users: two ordered users selected from M users
  access: F-NOMA and cognitive-radio-inspired CR-NOMA
channel:
  model: ordered scalar Rayleigh fading channel gains
  sic: strong receiver cancels weak message in rate model
  power_adaptation: F-NOMA fixed; CR-NOMA channel-dependent primary SINR protection
objective: Analyze pairing effects on relative sum rates, individual rates, outage and ergodic rates
  for fixed-power and primary-QoS-protecting NOMA.
constraints:
- F-NOMA squared amplitude coefficients sum to one, with weak-user coefficient at least strong-user
  coefficient.
- CR-NOMA limits strong-user power by the weak-user targeted SINR; allocation can be zero.
method:
- Rayleigh order-statistic exact and high-SNR analysis.
- Monte Carlo comparisons across different user pairs.
baselines_compared:
- Equal-time TDMA for F-NOMA, with one-half rate factor and shared transmit SNR.
- Primary-user-only orthogonal service for the CR-NOMA sum-rate comparison.
metrics:
- Probability NOMA sum rate is below OMA
- Individual-rate comparison probabilities
- Strong-user outage probability
- Ergodic additional rate
key_results:
- F-NOMA sum-rate loss probability decreases at high SNR in the analyzed Rayleigh model, but finite-SNR
  loss events are included.
- Fixed-power NOMA can disadvantage the weaker individual rate at high SNR.
- CR-NOMA strong-user admission and outage are limited by the weak-user QoS protection.
limitations_stated:
- A poor weak-user channel and high SINR threshold can consume all available power and leave the strong
  user unserved.
future_work_stated:
- Use the analysis as criteria for distributed dynamic user pairing or grouping.
