id: doi:10.1109/tvt.2017.2689000
title: A Fair Power Allocation Approach to NOMA in Multi-user SISO Systems
authors:
- José Armando Oviedo
- Hamid R. Sadjadpour
year: 2017
venue:
  name: IEEE Transactions on Vehicular Technology
  metadata_source: retrieved candidate record; manuscript version distinguished in notes
citations: null
system:
  direction: downlink
  antennas: single antenna BS and receivers
  users: two-user analysis and extension to K users
  access: Fair-NOMA superposition and SIC
channel:
  model: slow fading; i.i.d. exponential channel power gains for expectation analysis
  noise: unit variance complex Gaussian
  sic: strong user decodes and removes weak-user signal in achievable-rate model
objective: Find channel-dependent NOMA allocations that give each user at least its equal-time OMA
  rate and characterize capacity and outage gains.
constraints:
- Same total transmit power and full transmission period; OMA users each occupy one-half of the period
  in the two-user case.
- Strong-user fraction must lie between the OMA-equivalent lower bound from the strong channel and
  upper bound from the weak channel.
- The paper explicitly starts the two-user strong-user fraction a in (0, 1/2); this is a paper-specific
  power-order restriction.
method:
- Solve both individual NOMA>=OMA rate inequalities to obtain a power interval.
- Derive ergodic capacities, asymptotic gains and outage probabilities.
- Compare numerical simulations and extend the allocation construction to K users.
baselines_compared:
- Equal-time OMA with the full instantaneous transmit power during each user slot.
- Fixed-power NOMA for opportunistic pairing.
metrics:
- Individual and sum capacities
- Outage probabilities
- Total power required to match OMA rates
key_results:
- A nonempty interval of power fractions is constructed to ensure both NOMA rates meet the corresponding
  OMA rates in the stated ideal two-user model.
- The multiuser construction can match each equal-time OMA rate without exceeding total transmit power.
limitations_stated:
- The opportunistic-pairing high-SNR approximation requires larger SNR as user population increases.
- Full signal-level bit-error-rate analysis and simulation remains necessary.
future_work_stated:
- Extend Fair-NOMA to MIMO with composite channel ordering.
- Analyze and simulate bit-error-rate effects of superposition and unequal rates.
