notes: Acquired arXiv 1703.09394v2 dated April 2017; candidate record also records TVT venue. Fairness
  thresholds here are channel-dependent equal-time OMA capacities, not arbitrary fixed QoS targets.
  Ideal SIC is inferred from equations. Do not transfer population/high-SNR numerical constants to
  the M11 protocol. Citation count remains null despite a dated database count existing, because no
  count is needed for scientific synthesis. The two-user model explicitly begins with a_strong in
  (0,1/2) on p.2. This paper-specific power-order restriction must not be silently imposed on the
  approved toy feasible set; its derived Fair-NOMA interval satisfies that bound.
