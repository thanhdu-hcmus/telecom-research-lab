notes: Publication year/ICC venue from retrieved arXiv metadata refer to 2018; acquired arXiv v2 is
  dated January 2019. Page 4 simulations use K=4, M=1, N=4, not the exact two-user SISO toy. Common
  fixed QoS/outage-event construction does not establish a sum-rate optimum with unequal fixed QoS.
  Extraction visibly has sign/exponent inconsistencies around Theorem 1 proof; paraphrase the result
  and caveat only, and independently derive needed equations in P4.
