id: doi:10.1109/icc.2018.8422366
title: On the Power Allocation Limits for Downlink Multi-user NOMA with QoS
authors:
- José Armando Oviedo
- Hamid R. Sadjadpour
year: 2018
venue:
  name: Proceedings of the International Conference on Communications (ICC), 2018
  metadata_source: retrieved candidate record; manuscript version distinguished in notes
citations: null
system:
  direction: downlink
  users: K users on one beam
  antennas: M transmit and N receive antennas reduced to ordered effective scalar gains
  access: NOMA superposition and sequential decoding
channel:
  model: composite channel Gn=u_n^H H_n v with isotropic transmit beam and maximum-ratio receive combining
  ordering: ascending effective channel power gains
  sic: decoding all earlier messages is part of the success condition
objective: Characterize power allocation limits and fixed-power coefficients for common minimum QoS
  and compare decoding/outage events with equal-slot OMA.
constraints:
- All power fractions sum to one.
- All users and their SIC decoding stages must meet the same target rate R0.
- Interference coefficients must satisfy necessary limits; satisfying a necessary limit alone does
  not guarantee success.
method:
- Derive necessary interference-power limits for avoiding certain outage.
- Solve recurrence for fixed power fractions yielding identical SIC and own-message events.
- Prove equality with OMA outage events and check simulations.
baselines_compared:
- OMA with one-Kth time/frequency share per user and the full transmit SNR while active.
metrics:
- Own-message outage probability
- SIC decoding outage probability
key_results:
- The fixed coefficients in Lemma 1 give the same QoS decoding events as the defined OMA reference.
- Equality of outage events explicitly does not mean equality of instantaneous capacities.
- Necessary interference limits alone are insufficient to guarantee a target rate.
limitations_stated:
- Perfect instantaneous CSIT for dynamic capacity-guaranteeing allocation is described as unrealistic
  in practical systems.
future_work_stated:
- Consider a distinct target rate for each user.
- Compare the fixed-power benchmark with dynamic power allocation and regions of outage.
