id: doi:10.1109/comst.2016.2621116
title: 'Power-Domain Non-Orthogonal Multiple Access (NOMA) in 5G Systems: Potentials and Challenges'
authors:
- S. M. Riazul Islam
- Nurilla Avazov
- Octavia A. Dobre
- Kyung-Sup Kwak
year: 2016
venue:
  name: arXiv
  metadata_source: retrieved candidate record; manuscript version distinguished in notes
citations: null
system:
  coverage: survey of power-domain NOMA; scalar downlink model and broader MIMO/cooperative contexts
  access: superposition coding and SIC
channel:
  illustrative_model: single-cell single-antenna users, i.i.d. block Rayleigh fading and AWGN
  sic: perfect cancellation for illustrative achievable rates; imperfect cancellation discussed separately
objective: Survey capacity, power allocation, fairness, pairing and implementation challenges rather
  than solve the exact M11 optimization problem.
constraints: null
method:
- Synthesize published NOMA capacity and allocation results.
- Discuss complexity, error propagation, quantization and signalling overhead.
baselines_compared: null
metrics: null
key_results:
- The illustrative rate formula assumes perfect signal superposition and SIC.
- The implementation discussion identifies extra decoding complexity, error propagation and CSI/SIC-order
  signalling overhead.
limitations_stated:
- Additional SIC decoding complexity grows with the number of users.
- Decoding errors can propagate through SIC stages.
- Quantization and signalling/processing overhead can reduce practical benefit.
future_work_stated:
- Study practical imperfect-SIC effects and additional over-the-air demonstrations.
