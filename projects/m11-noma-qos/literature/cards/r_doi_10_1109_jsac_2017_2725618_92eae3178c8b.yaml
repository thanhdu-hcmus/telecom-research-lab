id: doi:10.1109/jsac.2017.2725618
title: On Optimal Power Allocation for Downlink Non-Orthogonal Multiple Access Systems
authors:
- Jianyue Zhu
- Jiaheng Wang
- Yongming Huang
- Shiwen He
- Xiaohu You
- Luxi Yang
year: 2017
venue:
  name: arXiv
  metadata_source: retrieved candidate record; manuscript version distinguished in notes
citations: null
system:
  direction: downlink
  users: two users per channel; multiple orthogonal channels
  access: power-domain NOMA with SIC and joint channel assignment
channel:
  model: Rayleigh fading with distance-dependent path loss and AWGN
  ordering: descending channel-to-noise ratio; user 1 strongest
  sic: interference-free strong-user rate following ideal SIC model
objective: Optimize power allocation for multiple objectives; relevant branch maximizes sum rate under
  individual QoS and total-power constraints, with fixed channel assignment.
constraints:
- Total power budget and individual minimum rates.
- 'Additional paper-specific power-order constraint: strong-user power no greater than weak-user power.'
- Stated closed-form SR2 result includes weak-user rate threshold and power-budget SIC-stability conditions.
method:
- Decompose fixed-channel power allocation into within-channel split and across-channel budgets.
- Differentiate the sum-rate objective to obtain a boundary solution; waterfilling across channels.
- Matching-based joint assignment algorithm and numerical comparison.
baselines_compared:
- OFDMA with each user assigned B/N bandwidth and waterfilled power.
- Difference-of-convex power allocation, conventional user pairing and exhaustive assignment search.
metrics:
- Minimum user rate
- Sum rate
- Spectral efficiency
- Energy efficiency
key_results:
- Under Proposition 3 conditions the optimal strong-user allocation reaches its QoS-defined upper
  bound, and the weak user meets its minimum rate exactly.
- The derivative proof on page 7 shows nondecreasing sum rate with strong-user power for ordered CNRs.
- The numerical OFDMA comparison uses multichannel assignment and optimized power; it is not the M11
  equal-time scalar reference.
limitations_stated:
- Joint assignment and power allocation is a mixed integer problem; exhaustive joint optimization
  has prohibitive complexity.
- Their SIC-stability conditions restrict the validity of the stated allocation results.
future_work_stated: null
