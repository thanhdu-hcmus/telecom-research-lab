id: arxiv:1504.07751
title: 'NOMA: An Information Theoretic Perspective'
authors:
- Peng Xu
- Zhiguo Ding
- Xuchu Dai
- H. Vincent Poor
year: 2015
venue:
  name: arXiv
  metadata_source: retrieved candidate record; manuscript version distinguished in notes
citations: null
system:
  direction: downlink
  antennas: one transmitter antenna and one antenna at each receiver
  users: 2
  access: power-domain superposition; SIC at stronger-channel receiver
channel:
  model: ordered scalar Gaussian broadcast channel; Rayleigh order statistics for probability study
  noise: unit variance additive Gaussian noise
  sic: ideal cancellation in achievable-rate formulas
  power_adaptation: fixed power split for probability study; dynamic instantaneous CSI adaptation
    discussed as future work
  csi: null
objective: Characterize NOMA versus TDMA rate regions, individual rates and sum rates, and probabilities
  of relative performance for paired users.
constraints:
- Power fractions sum to one and are nonnegative; paper additionally requires weak-user power fraction
  at least the strong-user fraction.
- TDMA time fractions sum to one; equal halves are used in the probability derivation.
method:
- Rate-region geometry and monotonicity/concavity propositions.
- Rayleigh order-statistic probability analysis and Monte Carlo comparison.
baselines_compared:
- TDMA with generic time fractions in the region discussion and equal-length slots in probability
  examples.
metrics:
- Individual achievable rates
- Sum achievable rate
- Probabilities of four relative-rate events
key_results:
- NOMA boundary concavity and increasing sum rate with the stronger-user rate support conditional
  comparisons.
- The fixed-power analysis explicitly includes an event in which NOMA sum rate is below TDMA sum rate;
  arbitrary fixed-power NOMA dominance is not established.
- Selected large channel-separation examples increase the probability that both NOMA individual rates
  exceed equal-time TDMA.
limitations_stated:
- Fixed power allocation is used for simplicity; dynamic instantaneous-CSI allocation could enlarge
  the ergodic rate region with added complexity.
future_work_stated:
- Dynamic power allocation based on instantaneous CSI.
- Connecting MIMO NOMA to information theoretic MIMO broadcasting.
