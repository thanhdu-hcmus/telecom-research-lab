id: idea-05
title: Weak-message decoding consistency at both receivers
problem: 'Interference-free strong-user rates can be used incorrectly if weak-message
  decoding at the strong receiver is inconsistent. The proposal preserves G1-approved
  M11: two ordered scalar downlink users, perfect instantaneous CSI and ideal SIC,
  unit normalized noise/bandwidth, matched instantaneous power and channel realization,
  arbitrary fixed per-block individual QoS and equal-time OMA at full active-slot
  power. Optimal-rate comparisons use the both-feasible set and retain all infeasible
  counts. No distribution, QoS/SNR grid, seed, stopping rule, tolerance or simulation
  is selected here.'
gap_refs:
- BQ1
- BQ3
- BQ4
closest_works:
- id: doi:10.1109/icc.2018.8422366
  delta: 'QoS-limits PDF pp.2-4 distinguishes necessary interference limits from full
    own-message/SIC success and constructs common-target OMA-equivalent outage events.
    M11 is two-user scalar instantaneous sum-rate optimization with arbitrary individual
    QoS; outage-event equality is not taken as capacity equality. Proposed emphasis:
    ideal-SIC decoding order and constraint consistency. This is a benchmark adaptation/validation
    delta, not an originality claim.'
- id: doi:10.1109/tvt.2017.2689000
  delta: 'Fair-NOMA PDF pp.2-3 solves individual NOMA-versus-equal-time-OMA inequalities
    with full active-slot power. Its QoS thresholds are channel-dependent OMA rates
    and its initial power-order restriction is paper-specific. M11 uses arbitrary
    fixed individual QoS and the approved full split range; fairness is a potential
    comparison witness, not a substituted objective. Proposed emphasis: ideal-SIC
    decoding order and constraint consistency. This is a benchmark adaptation/validation
    delta, not an originality claim.'
- id: doi:10.1109/jsac.2017.2725618
  delta: 'Zhu PDF pp.6-7 gives a QoS boundary optimizer and derivative argument with
    extra power-order/SIC-stability conditions; pp.10-11 uses multichannel waterfilled
    OFDMA. M11 is one two-user scalar channel with equal-time OMA and does not import
    those extra constraints. Proposed emphasis: ideal-SIC decoding order and constraint
    consistency. This is a benchmark adaptation/validation delta, not an originality
    claim.'
method_sketch: 'Using ordered scalar gains and ideal SIC, derive the weak-message
  decodability relation at both receivers. Show whether own-message QoS already implies
  the required SIC condition in this exact model; do not add a practical margin or
  import Zhu stability restrictions. Evaluate direct decoding residuals at the optimal
  split and compare matched equal-time OMA with full feasibility accounting. The proposal
  preserves G1-approved M11: two ordered scalar downlink users, perfect instantaneous
  CSI and ideal SIC, unit normalized noise/bandwidth, matched instantaneous power
  and channel realization, arbitrary fixed per-block individual QoS and equal-time
  OMA at full active-slot power. Optimal-rate comparisons use the both-feasible set
  and retain all infeasible counts. No distribution, QoS/SNR grid, seed, stopping
  rule, tolerance or simulation is selected here.'
expected_contributions:
- An established-method M11 benchmark artifact emphasizing ideal-SIC decoding order
  and constraint consistency; no original scientific contribution, submitted-paper
  result or measured rate gain is claimed.
- 'Falsifiable validation improvement over a naive unchecked implementation: Direct
  strong-receiver weak-message rates must support the weak message whenever the derived
  ordered-channel condition holds; disagreement with the own-rate feasibility classifier
  falsifies decoding-order implementation.'
- A traceable comparison of the same constrained optimal NOMA model and equal-time
  OMA, with both-feasible rates and complete feasibility counts.
risks:
- Received-power ordering can be confused with gain ordering.
- Copied practical SIC constraints would change the approved feasible set.
- Outputs remain prospective until model/protocol approval and actual later simulations;
  planning feasibility does not mean baseline acceptance.
