id: idea-06
title: Individual fixed-QoS feasibility map and active-bound analysis
problem: 'Replacing independent fixed QoS targets by a common threshold or OMA-relative
  targets changes the interval and optimum. The proposal preserves G1-approved M11:
  two ordered scalar downlink users, perfect instantaneous CSI and ideal SIC, unit
  normalized noise/bandwidth, matched instantaneous power and channel realization,
  arbitrary fixed per-block individual QoS and equal-time OMA at full active-slot
  power. Optimal-rate comparisons use the both-feasible set and retain all infeasible
  counts. No distribution, QoS/SNR grid, seed, stopping rule, tolerance or simulation
  is selected here.'
gap_refs:
- BQ1
- BQ3
closest_works:
- id: doi:10.1109/jsac.2017.2725618
  delta: 'Zhu PDF pp.6-7 gives a QoS boundary optimizer and derivative argument with
    extra power-order/SIC-stability conditions; pp.10-11 uses multichannel waterfilled
    OFDMA. M11 is one two-user scalar channel with equal-time OMA and does not import
    those extra constraints. Proposed emphasis: heterogeneous QoS and active constraints.
    This is a benchmark adaptation/validation delta, not an originality claim.'
- id: doi:10.1109/tvt.2017.2689000
  delta: 'Fair-NOMA PDF pp.2-3 solves individual NOMA-versus-equal-time-OMA inequalities
    with full active-slot power. Its QoS thresholds are channel-dependent OMA rates
    and its initial power-order restriction is paper-specific. M11 uses arbitrary
    fixed individual QoS and the approved full split range; fairness is a potential
    comparison witness, not a substituted objective. Proposed emphasis: heterogeneous
    QoS and active constraints. This is a benchmark adaptation/validation delta, not
    an originality claim.'
- id: doi:10.1109/icc.2018.8422366
  delta: 'QoS-limits PDF pp.2-4 distinguishes necessary interference limits from full
    own-message/SIC success and constructs common-target OMA-equivalent outage events.
    M11 is two-user scalar instantaneous sum-rate optimization with arbitrary individual
    QoS; outage-event equality is not taken as capacity equality. Proposed emphasis:
    heterogeneous QoS and active constraints. This is a benchmark adaptation/validation
    delta, not an originality claim.'
method_sketch: 'Derive fixed individual QoS bounds without imposing a common target.
  Propose a deterministic map across target pairs selected at G4/G5, distinguishing
  empty, singleton and nonempty intervals and the active optimality bound. Retain
  matched equal-time OMA and classify both schemes for each target pair. QoS values
  and resolution remain undecided. The proposal preserves G1-approved M11: two ordered
  scalar downlink users, perfect instantaneous CSI and ideal SIC, unit normalized
  noise/bandwidth, matched instantaneous power and channel realization, arbitrary
  fixed per-block individual QoS and equal-time OMA at full active-slot power. Optimal-rate
  comparisons use the both-feasible set and retain all infeasible counts. No distribution,
  QoS/SNR grid, seed, stopping rule, tolerance or simulation is selected here.'
expected_contributions:
- An established-method M11 benchmark artifact emphasizing heterogeneous QoS and active
  constraints; no original scientific contribution, submitted-paper result or measured
  rate gain is claimed.
- 'Falsifiable validation improvement over a naive unchecked implementation: Direct
  rate feasibility and the interval classifier must agree at boundaries; replacing
  unequal targets by a common one must be detected as an input mismatch.'
- A traceable comparison of the same constrained optimal NOMA model and equal-time
  OMA, with both-feasible rates and complete feasibility counts.
risks:
- Map granularity can miss transition boundaries.
- An empty interval must remain infeasible, not be clipped into a valid split.
- Outputs remain prospective until model/protocol approval and actual later simulations;
  planning feasibility does not mean baseline acceptance.
