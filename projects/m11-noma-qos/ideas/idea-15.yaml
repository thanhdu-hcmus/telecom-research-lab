id: idea-15
title: Independent-seed Monte Carlo convergence with paired counts
problem: 'One seed or too few both-feasible blocks gives unstable summaries even with
  a correct per-block optimum. The proposal preserves G1-approved M11: two ordered
  scalar downlink users, perfect instantaneous CSI and ideal SIC, unit normalized
  noise/bandwidth, matched instantaneous power and channel realization, arbitrary
  fixed per-block individual QoS and equal-time OMA at full active-slot power. Optimal-rate
  comparisons use the both-feasible set and retain all infeasible counts. No distribution,
  QoS/SNR grid, seed, stopping rule, tolerance or simulation is selected here.'
gap_refs:
- BQ2
- BQ3
- BQ4
closest_works:
- id: doi:10.48550/arxiv.1412.2799
  delta: 'Ding PDF pp.2-3 studies fixed-split pairing and finite-SNR loss; p.4 uses
    primary-only CR comparison and can give zero secondary allocation. M11 keeps two
    scalar users, optimizes both fixed individual QoS targets and uses matched equal-time
    OMA, not the primary-only reference. Proposed emphasis: sampling uncertainty and
    conditional-statistic repeatability. This is a benchmark adaptation/validation
    delta, not an originality claim.'
- id: arxiv:1504.07751
  delta: 'Xu PDF pp.1-2 supplies ordered scalar broadcast rates and region geometry;
    p.2 includes fixed-split sum-rate loss and p.3 uses a fixed split. M11 optimizes
    the full feasible split for arbitrary fixed individual QoS and keeps equal-time
    OMA; its paper-specific weak-power-at-least-half constraint is not imported. Proposed
    emphasis: sampling uncertainty and conditional-statistic repeatability. This is
    a benchmark adaptation/validation delta, not an originality claim.'
- id: doi:10.1109/tvt.2017.2689000
  delta: 'Fair-NOMA PDF pp.2-3 solves individual NOMA-versus-equal-time-OMA inequalities
    with full active-slot power. Its QoS thresholds are channel-dependent OMA rates
    and its initial power-order restriction is paper-specific. M11 uses arbitrary
    fixed individual QoS and the approved full split range; fairness is a potential
    comparison witness, not a substituted objective. Proposed emphasis: sampling uncertainty
    and conditional-statistic repeatability. This is a benchmark adaptation/validation
    delta, not an originality claim.'
method_sketch: 'Derive and deterministically validate the optimum first. At P5 propose
  independent seed streams and sample-size convergence using an explicitly approved
  channel law, keeping NOMA/OMA paired per realization. Retain all feasibility counts
  and report intersection-only differences with estimator definitions and uncertainty
  criteria approved before runs. No seeds, counts or stopping rules are selected now.
  The proposal preserves G1-approved M11: two ordered scalar downlink users, perfect
  instantaneous CSI and ideal SIC, unit normalized noise/bandwidth, matched instantaneous
  power and channel realization, arbitrary fixed per-block individual QoS and equal-time
  OMA at full active-slot power. Optimal-rate comparisons use the both-feasible set
  and retain all infeasible counts. No distribution, QoS/SNR grid, seed, stopping
  rule, tolerance or simulation is selected here.'
expected_contributions:
- An established-method M11 benchmark artifact emphasizing sampling uncertainty and
  conditional-statistic repeatability; no original scientific contribution, submitted-paper
  result or measured rate gain is claimed.
- 'Falsifiable validation improvement over a naive unchecked implementation: Independent
  repetitions must meet later uncertainty/convergence criteria and preserve counts;
  insufficient both-feasible samples are inconclusive, not claimed gains.'
- A traceable comparison of the same constrained optimal NOMA model and equal-time
  OMA, with both-feasible rates and complete feasibility counts.
risks:
- Rare intersection events may exceed the CPU estimate.
- Optional stopping or correlated streams can bias estimates unless protocol controls
  them.
- Outputs remain prospective until model/protocol approval and actual later simulations;
  planning feasibility does not mean baseline acceptance.
