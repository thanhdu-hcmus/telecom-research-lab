id: idea-10
title: Endpoint and singleton QoS cases with power-budget checks
problem: 'Clipping a split or assuming strictly positive user powers can hide endpoints,
  singleton optima or infeasibility. The proposal preserves G1-approved M11: two ordered
  scalar downlink users, perfect instantaneous CSI and ideal SIC, unit normalized
  noise/bandwidth, matched instantaneous power and channel realization, arbitrary
  fixed per-block individual QoS and equal-time OMA at full active-slot power. Optimal-rate
  comparisons use the both-feasible set and retain all infeasible counts. No distribution,
  QoS/SNR grid, seed, stopping rule, tolerance or simulation is selected here.'
gap_refs:
- BQ1
- BQ3
- BQ4
closest_works:
- id: doi:10.1109/jsac.2017.2725618
  delta: 'Zhu PDF pp.6-7 gives a QoS boundary optimizer and derivative argument with
    extra power-order/SIC-stability conditions; pp.10-11 uses multichannel waterfilled
    OFDMA. M11 is one two-user scalar channel with equal-time OMA and does not import
    those extra constraints. Proposed emphasis: zero-target and resource-exhausting
    boundaries. This is a benchmark adaptation/validation delta, not an originality
    claim.'
- id: doi:10.48550/arxiv.1412.2799
  delta: 'Ding PDF pp.2-3 studies fixed-split pairing and finite-SNR loss; p.4 uses
    primary-only CR comparison and can give zero secondary allocation. M11 keeps two
    scalar users, optimizes both fixed individual QoS targets and uses matched equal-time
    OMA, not the primary-only reference. Proposed emphasis: zero-target and resource-exhausting
    boundaries. This is a benchmark adaptation/validation delta, not an originality
    claim.'
- id: doi:10.1109/icc.2018.8422366
  delta: 'QoS-limits PDF pp.2-4 distinguishes necessary interference limits from full
    own-message/SIC success and constructs common-target OMA-equivalent outage events.
    M11 is two-user scalar instantaneous sum-rate optimization with arbitrary individual
    QoS; outage-event equality is not taken as capacity equality. Proposed emphasis:
    zero-target and resource-exhausting boundaries. This is a benchmark adaptation/validation
    delta, not an originality claim.'
method_sketch: 'Derive endpoint/singleton conditions from nonnegative unit-sum powers
  and fixed individual QoS. Propose zero-target and resource-exhausting target cases,
  both-feasible and infeasible comparisons, without choosing thresholds now. Check
  optimal rates, power sum, direct residuals and equal-time OMA status. Zero NOMA
  allocation is an endpoint of the same model, not primary-only OMA. The proposal
  preserves G1-approved M11: two ordered scalar downlink users, perfect instantaneous
  CSI and ideal SIC, unit normalized noise/bandwidth, matched instantaneous power
  and channel realization, arbitrary fixed per-block individual QoS and equal-time
  OMA at full active-slot power. Optimal-rate comparisons use the both-feasible set
  and retain all infeasible counts. No distribution, QoS/SNR grid, seed, stopping
  rule, tolerance or simulation is selected here.'
expected_contributions:
- An established-method M11 benchmark artifact emphasizing zero-target and resource-exhausting
  boundaries; no original scientific contribution, submitted-paper result or measured
  rate gain is claimed.
- 'Falsifiable validation improvement over a naive unchecked implementation: Accepted
  endpoints must satisfy direct rates and power budget, singleton cases must contain
  the derived unique point and empty intervals must remain infeasible; clipping-induced
  acceptance falsifies the check.'
- A traceable comparison of the same constrained optimal NOMA model and equal-time
  OMA, with both-feasible rates and complete feasibility counts.
risks:
- Invalid log inputs may be evaluated before infeasibility is classified.
- A primary-only reference must not replace equal-time OMA for endpoint cases.
- Outputs remain prospective until model/protocol approval and actual later simulations;
  planning feasibility does not mean baseline acceptance.
