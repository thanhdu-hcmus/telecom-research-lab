id: idea-13
title: Independent Python and MATLAB implementations of one model
problem: 'An implementation can validate itself when its analysis and oracle reuse
  the same erroneous function. The proposal preserves G1-approved M11: two ordered
  scalar downlink users, perfect instantaneous CSI and ideal SIC, unit normalized
  noise/bandwidth, matched instantaneous power and channel realization, arbitrary
  fixed per-block individual QoS and equal-time OMA at full active-slot power. Optimal-rate
  comparisons use the both-feasible set and retain all infeasible counts. No distribution,
  QoS/SNR grid, seed, stopping rule, tolerance or simulation is selected here.'
gap_refs:
- BQ1
- BQ2
- BQ3
- BQ4
closest_works:
- id: doi:10.1109/jsac.2017.2725618
  delta: 'Zhu PDF pp.6-7 gives a QoS boundary optimizer and derivative argument with
    extra power-order/SIC-stability conditions; pp.10-11 uses multichannel waterfilled
    OFDMA. M11 is one two-user scalar channel with equal-time OMA and does not import
    those extra constraints. Proposed emphasis: language-independent rate and feasibility
    agreement. This is a benchmark adaptation/validation delta, not an originality
    claim.'
- id: doi:10.1109/tvt.2017.2689000
  delta: 'Fair-NOMA PDF pp.2-3 solves individual NOMA-versus-equal-time-OMA inequalities
    with full active-slot power. Its QoS thresholds are channel-dependent OMA rates
    and its initial power-order restriction is paper-specific. M11 uses arbitrary
    fixed individual QoS and the approved full split range; fairness is a potential
    comparison witness, not a substituted objective. Proposed emphasis: language-independent
    rate and feasibility agreement. This is a benchmark adaptation/validation delta,
    not an originality claim.'
- id: arxiv:1504.07751
  delta: 'Xu PDF pp.1-2 supplies ordered scalar broadcast rates and region geometry;
    p.2 includes fixed-split sum-rate loss and p.3 uses a fixed split. M11 optimizes
    the full feasible split for arbitrary fixed individual QoS and keeps equal-time
    OMA; its paper-specific weak-power-at-least-half constraint is not imported. Proposed
    emphasis: language-independent rate and feasibility agreement. This is a benchmark
    adaptation/validation delta, not an originality claim.'
method_sketch: 'After P4 propose separately written Python and MATLAB implementations
  of the same optimizer, direct QoS residuals and equal-time OMA, using shared deterministic
  inputs. Compare allocations, direct rates, optimum objective and statuses before
  aggregation. Later independently seeded checks use the approved channel law and
  uncertainty criteria. No second physical model or copied oracle is chosen. The proposal
  preserves G1-approved M11: two ordered scalar downlink users, perfect instantaneous
  CSI and ideal SIC, unit normalized noise/bandwidth, matched instantaneous power
  and channel realization, arbitrary fixed per-block individual QoS and equal-time
  OMA at full active-slot power. Optimal-rate comparisons use the both-feasible set
  and retain all infeasible counts. No distribution, QoS/SNR grid, seed, stopping
  rule, tolerance or simulation is selected here.'
expected_contributions:
- An established-method M11 benchmark artifact emphasizing language-independent rate
  and feasibility agreement; no original scientific contribution, submitted-paper
  result or measured rate gain is claimed.
- 'Falsifiable validation improvement over a naive unchecked implementation: Independent
  implementations must agree on deterministic optimum objective, rates and statuses
  within later tolerances; unexplained differences falsify agreement. Flat-objective
  allocations need objective/feasibility agreement rather than arbitrary identical
  tie choices.'
- A traceable comparison of the same constrained optimal NOMA model and equal-time
  OMA, with both-feasible rates and complete feasibility counts.
risks:
- Copying the same formula bug weakens independence.
- Amplitude versus power gain, indexing and tie conventions can diverge.
- Outputs remain prospective until model/protocol approval and actual later simulations;
  planning feasibility does not mean baseline acceptance.
risk_rating: 2
