id: idea-02
title: Bounded exhaustive allocation checks with discretization accounting
problem: 'A coarse split grid can omit a narrow feasible interval or understate the
  optimum, producing an artificial OMA advantage. The proposal preserves G1-approved
  M11: two ordered scalar downlink users, perfect instantaneous CSI and ideal SIC,
  unit normalized noise/bandwidth, matched instantaneous power and channel realization,
  arbitrary fixed per-block individual QoS and equal-time OMA at full active-slot
  power. Optimal-rate comparisons use the both-feasible set and retain all infeasible
  counts. No distribution, QoS/SNR grid, seed, stopping rule, tolerance or simulation
  is selected here.'
gap_refs:
- BQ1
- BQ3
- BQ4
closest_works:
- id: arxiv:1504.07751
  delta: 'Xu PDF pp.1-2 supplies ordered scalar broadcast rates and region geometry;
    p.2 includes fixed-split sum-rate loss and p.3 uses a fixed split. M11 optimizes
    the full feasible split for arbitrary fixed individual QoS and keeps equal-time
    OMA; its paper-specific weak-power-at-least-half constraint is not imported. Proposed
    emphasis: grid discretization and narrow-interval coverage. This is a benchmark
    adaptation/validation delta, not an originality claim.'
- id: doi:10.1109/jsac.2017.2725618
  delta: 'Zhu PDF pp.6-7 gives a QoS boundary optimizer and derivative argument with
    extra power-order/SIC-stability conditions; pp.10-11 uses multichannel waterfilled
    OFDMA. M11 is one two-user scalar channel with equal-time OMA and does not import
    those extra constraints. Proposed emphasis: grid discretization and narrow-interval
    coverage. This is a benchmark adaptation/validation delta, not an originality
    claim.'
- id: doi:10.1109/tvt.2017.2689000
  delta: 'Fair-NOMA PDF pp.2-3 solves individual NOMA-versus-equal-time-OMA inequalities
    with full active-slot power. Its QoS thresholds are channel-dependent OMA rates
    and its initial power-order restriction is paper-specific. M11 uses arbitrary
    fixed individual QoS and the approved full split range; fairness is a potential
    comparison witness, not a substituted objective. Proposed emphasis: grid discretization
    and narrow-interval coverage. This is a benchmark adaptation/validation delta,
    not an originality claim.'
method_sketch: 'Derive the same scalar QoS interval and optimum. Propose exhaustive
  evaluation over the feasible range with exact interval endpoints represented and
  successive refinements whose spacing is selected in P5. Contrast grid maxima with
  the analytic solution, retain infeasible cases, and use matched equal-time OMA on
  the same realizations. The proposal preserves G1-approved M11: two ordered scalar
  downlink users, perfect instantaneous CSI and ideal SIC, unit normalized noise/bandwidth,
  matched instantaneous power and channel realization, arbitrary fixed per-block individual
  QoS and equal-time OMA at full active-slot power. Optimal-rate comparisons use the
  both-feasible set and retain all infeasible counts. No distribution, QoS/SNR grid,
  seed, stopping rule, tolerance or simulation is selected here.'
expected_contributions:
- An established-method M11 benchmark artifact emphasizing grid discretization and
  narrow-interval coverage; no original scientific contribution, submitted-paper result
  or measured rate gain is claimed.
- 'Falsifiable validation improvement over a naive unchecked implementation: Refinement
  must reduce the objective discrepancy according to an independently justified discretization
  bound; a missed endpoint, falsely infeasible block or nonconvergent discrepancy
  falsifies reliable search.'
- A traceable comparison of the same constrained optimal NOMA model and equal-time
  OMA, with both-feasible rates and complete feasibility counts.
risks:
- Grid-only feasibility can miss intervals narrower than one spacing.
- Dense grids can use unnecessary memory; grid design remains a P5 choice.
- Outputs remain prospective until model/protocol approval and actual later simulations;
  planning feasibility does not mean baseline acceptance.
