id: idea-14
title: Precision and normalized-SNR invariance in the comparison
problem: 'SNR conversion, amplitude/power mistakes or unstable logarithms can create
  false differences or misclassify narrow intervals. The proposal preserves G1-approved
  M11: two ordered scalar downlink users, perfect instantaneous CSI and ideal SIC,
  unit normalized noise/bandwidth, matched instantaneous power and channel realization,
  arbitrary fixed per-block individual QoS and equal-time OMA at full active-slot
  power. Optimal-rate comparisons use the both-feasible set and retain all infeasible
  counts. No distribution, QoS/SNR grid, seed, stopping rule, tolerance or simulation
  is selected here.'
gap_refs:
- BQ1
- BQ2
- BQ4
closest_works:
- id: arxiv:1504.07751
  delta: 'Xu PDF pp.1-2 supplies ordered scalar broadcast rates and region geometry;
    p.2 includes fixed-split sum-rate loss and p.3 uses a fixed split. M11 optimizes
    the full feasible split for arbitrary fixed individual QoS and keeps equal-time
    OMA; its paper-specific weak-power-at-least-half constraint is not imported. Proposed
    emphasis: numerical cancellation and conversion invariants. This is a benchmark
    adaptation/validation delta, not an originality claim.'
- id: doi:10.1109/tvt.2017.2689000
  delta: 'Fair-NOMA PDF pp.2-3 solves individual NOMA-versus-equal-time-OMA inequalities
    with full active-slot power. Its QoS thresholds are channel-dependent OMA rates
    and its initial power-order restriction is paper-specific. M11 uses arbitrary
    fixed individual QoS and the approved full split range; fairness is a potential
    comparison witness, not a substituted objective. Proposed emphasis: numerical
    cancellation and conversion invariants. This is a benchmark adaptation/validation
    delta, not an originality claim.'
- id: doi:10.1109/comst.2016.2621116
  delta: 'Islam survey PDF pp.7-8 gives historical scalar achievable-rate context
    under perfect superposition/SIC; pp.34-36 discusses decoding/signalling caveats.
    M11 keeps perfect CSI and ideal SIC and makes no practical-system gain claim.
    The survey is historical context, not an exact optimizer or current novelty proof.
    Proposed emphasis: numerical cancellation and conversion invariants. This is a
    benchmark adaptation/validation delta, not an originality claim.'
method_sketch: 'Derive normalized rates and propose equivalent algebraic evaluations
  and properly converted linear/dB representations of the identical SNR. Inspect equal-near
  gains, small rates and narrow intervals with an independent reference where available
  and approved at P5. Keep unit noise/bandwidth, instantaneous OMA power and bit/s/Hz
  reporting; introduce no new physical noise model. The proposal preserves G1-approved
  M11: two ordered scalar downlink users, perfect instantaneous CSI and ideal SIC,
  unit normalized noise/bandwidth, matched instantaneous power and channel realization,
  arbitrary fixed per-block individual QoS and equal-time OMA at full active-slot
  power. Optimal-rate comparisons use the both-feasible set and retain all infeasible
  counts. No distribution, QoS/SNR grid, seed, stopping rule, tolerance or simulation
  is selected here.'
expected_contributions:
- An established-method M11 benchmark artifact emphasizing numerical cancellation
  and conversion invariants; no original scientific contribution, submitted-paper
  result or measured rate gain is claimed.
- 'Falsifiable validation improvement over a naive unchecked implementation: Equivalent
  representations of one scenario must preserve direct rates, status and optimum within
  justified tolerances; representation-dependent signs or feasibility changes falsify
  numerical correctness.'
- A traceable comparison of the same constrained optimal NOMA model and equal-time
  OMA, with both-feasible rates and complete feasibility counts.
risks:
- Higher precision may still share an algebra error.
- Silent tolerance widening cannot resolve a boundary ambiguity.
- Outputs remain prospective until model/protocol approval and actual later simulations;
  planning feasibility does not mean baseline acceptance.
risk_rating: 2
