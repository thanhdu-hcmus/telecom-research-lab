id: idea-04
title: Rate-region construction of a matched OMA comparison witness
problem: 'A plotted gain does not establish why the optimized NOMA comparison should
  hold with arbitrary QoS and matched equal-time OMA both feasible. The proposal preserves
  G1-approved M11: two ordered scalar downlink users, perfect instantaneous CSI and
  ideal SIC, unit normalized noise/bandwidth, matched instantaneous power and channel
  realization, arbitrary fixed per-block individual QoS and equal-time OMA at full
  active-slot power. Optimal-rate comparisons use the both-feasible set and retain
  all infeasible counts. No distribution, QoS/SNR grid, seed, stopping rule, tolerance
  or simulation is selected here.'
gap_refs:
- BQ1
- BQ2
- BQ4
closest_works:
- id: doi:10.1109/tvt.2017.2689000
  delta: 'Fair-NOMA PDF pp.2-3 solves individual NOMA-versus-equal-time-OMA inequalities
    with full active-slot power. Its QoS thresholds are channel-dependent OMA rates
    and its initial power-order restriction is paper-specific. M11 uses arbitrary
    fixed individual QoS and the approved full split range; fairness is a potential
    comparison witness, not a substituted objective. Proposed emphasis: constructive
    conditional comparison proof. This is a benchmark adaptation/validation delta,
    not an originality claim.'
- id: arxiv:1504.07751
  delta: 'Xu PDF pp.1-2 supplies ordered scalar broadcast rates and region geometry;
    p.2 includes fixed-split sum-rate loss and p.3 uses a fixed split. M11 optimizes
    the full feasible split for arbitrary fixed individual QoS and keeps equal-time
    OMA; its paper-specific weak-power-at-least-half constraint is not imported. Proposed
    emphasis: constructive conditional comparison proof. This is a benchmark adaptation/validation
    delta, not an originality claim.'
- id: doi:10.1109/jsac.2017.2725618
  delta: 'Zhu PDF pp.6-7 gives a QoS boundary optimizer and derivative argument with
    extra power-order/SIC-stability conditions; pp.10-11 uses multichannel waterfilled
    OFDMA. M11 is one two-user scalar channel with equal-time OMA and does not import
    those extra constraints. Proposed emphasis: constructive conditional comparison
    proof. This is a benchmark adaptation/validation delta, not an originality claim.'
method_sketch: 'In P4 derive the scalar NOMA boundary and equal-time OMA point, then
  inspect a feasible NOMA witness meeting each OMA rate without replacing sum maximization
  by a fairness objective. Explain how OMA-feasible fixed QoS relates to the witness.
  Verify the conditional comparison with the actual optimum and preserve equality/infeasibility
  cases. Region plots do not introduce a different OMA scheduler. The proposal preserves
  G1-approved M11: two ordered scalar downlink users, perfect instantaneous CSI and
  ideal SIC, unit normalized noise/bandwidth, matched instantaneous power and channel
  realization, arbitrary fixed per-block individual QoS and equal-time OMA at full
  active-slot power. Optimal-rate comparisons use the both-feasible set and retain
  all infeasible counts. No distribution, QoS/SNR grid, seed, stopping rule, tolerance
  or simulation is selected here.'
expected_contributions:
- An established-method M11 benchmark artifact emphasizing constructive conditional
  comparison proof; no original scientific contribution, submitted-paper result or
  measured rate gain is claimed.
- 'Falsifiable validation improvement over a naive unchecked implementation: Each
  proposed witness must satisfy the approved power range and both OMA rates; a both-feasible
  counterexample to the precisely derived comparison falsifies the proof or implementation.'
- A traceable comparison of the same constrained optimal NOMA model and equal-time
  OMA, with both-feasible rates and complete feasibility counts.
risks:
- Fair-NOMA power-order premises must not restrict the M11 optimizer.
- A geometric picture cannot replace the arbitrary-QoS feasibility argument.
- Outputs remain prospective until model/protocol approval and actual later simulations;
  planning feasibility does not mean baseline acceptance.
