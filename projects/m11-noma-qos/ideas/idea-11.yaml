id: idea-11
title: Low-SNR feasibility limits and conditional expansion checks
problem: 'Low-SNR approximations can silently scale fixed QoS downward to make an
  infeasible system appear feasible. The proposal preserves G1-approved M11: two ordered
  scalar downlink users, perfect instantaneous CSI and ideal SIC, unit normalized
  noise/bandwidth, matched instantaneous power and channel realization, arbitrary
  fixed per-block individual QoS and equal-time OMA at full active-slot power. Optimal-rate
  comparisons use the both-feasible set and retain all infeasible counts. No distribution,
  QoS/SNR grid, seed, stopping rule, tolerance or simulation is selected here.'
gap_refs:
- BQ1
- BQ3
- BQ4
closest_works:
- id: arxiv:1504.07751
  delta: 'Xu PDF pp.1-2 supplies ordered scalar broadcast rates and region geometry;
    p.2 includes fixed-split sum-rate loss and p.3 uses a fixed split. M11 optimizes
    the full feasible split for arbitrary fixed individual QoS and keeps equal-time
    OMA; its paper-specific weak-power-at-least-half constraint is not imported. Proposed
    emphasis: small-power limits with fixed QoS retained. This is a benchmark adaptation/validation
    delta, not an originality claim.'
- id: doi:10.1109/tvt.2017.2689000
  delta: 'Fair-NOMA PDF pp.2-3 solves individual NOMA-versus-equal-time-OMA inequalities
    with full active-slot power. Its QoS thresholds are channel-dependent OMA rates
    and its initial power-order restriction is paper-specific. M11 uses arbitrary
    fixed individual QoS and the approved full split range; fairness is a potential
    comparison witness, not a substituted objective. Proposed emphasis: small-power
    limits with fixed QoS retained. This is a benchmark adaptation/validation delta,
    not an originality claim.'
- id: doi:10.1109/icc.2018.8422366
  delta: 'QoS-limits PDF pp.2-4 distinguishes necessary interference limits from full
    own-message/SIC success and constructs common-target OMA-equivalent outage events.
    M11 is two-user scalar instantaneous sum-rate optimization with arbitrary individual
    QoS; outage-event equality is not taken as capacity equality. Proposed emphasis:
    small-power limits with fixed QoS retained. This is a benchmark adaptation/validation
    delta, not an originality claim.'
method_sketch: 'In P4 derive small-SNR behavior from exact rates while holding individual
  QoS fixed. Distinguish zero-target cases from positive fixed QoS that becomes infeasible
  as SNR decreases. Compare exact optimal NOMA and equal-time OMA only where both
  are feasible; expansions are regime-limited validation predictions, not replacement
  objectives or changed thresholds. The proposal preserves G1-approved M11: two ordered
  scalar downlink users, perfect instantaneous CSI and ideal SIC, unit normalized
  noise/bandwidth, matched instantaneous power and channel realization, arbitrary
  fixed per-block individual QoS and equal-time OMA at full active-slot power. Optimal-rate
  comparisons use the both-feasible set and retain all infeasible counts. No distribution,
  QoS/SNR grid, seed, stopping rule, tolerance or simulation is selected here.'
expected_contributions:
- An established-method M11 benchmark artifact emphasizing small-power limits with
  fixed QoS retained; no original scientific contribution, submitted-paper result
  or measured rate gain is claimed.
- 'Falsifiable validation improvement over a naive unchecked implementation: Exact
  rates and approved expansions must agree within a later justified validity range;
  positive-QoS infeasible low-SNR cases must be classified, not averaged. Forced feasibility
  falsifies validation.'
- A traceable comparison of the same constrained optimal NOMA model and equal-time
  OMA, with both-feasible rates and complete feasibility counts.
risks:
- Positive fixed QoS may leave no sufficiently low-SNR both-feasible region.
- Approximation error needs a bounded regime before it is called an implementation
  failure.
- Outputs remain prospective until model/protocol approval and actual later simulations;
  planning feasibility does not mean baseline acceptance.
